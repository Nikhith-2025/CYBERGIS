server:
  bind:
    host: 0.0.0.0
    port: 5000
  url: http://localhost:5000
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  languages:
    - en-US
  pretty_print: true
  limits:
    default_items: 10
    max_items: 50
  map:
    url: https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}
    attribution: 'Basemap &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors'
  templates:
    path: theme/templates

logging:
  level: WARNING

metadata:
  identification:
    title:
      en: Coverage Service
    description:
      en: >-
        OGC API - Coverages service for ISRO/NRSC CartoDEM 30 m elevation data,
        sourced from Bhoonidhi. Request only the area you need instead of
        downloading whole tiles.
    keywords:
      en:
        - CartoDEM
        - DEM
        - elevation
        - Bhoonidhi
        - OGC API - Coverages
    keywords_type: theme
    terms_of_service: https://bhoonidhi.nrsc.gov.in
    url: https://bhoonidhi.nrsc.gov.in
  license:
    name: CartoDEM data courtesy of NRSC/ISRO via Bhoonidhi
    url: https://bhoonidhi.nrsc.gov.in
  provider:
    name: CYBERGIS mid-sem project
    url: https://github.com/Nikhith-2025
  contact:
    name: Nikhith
    position: Student
    email: nikhith2024@gmail.com
    url: https://github.com/Nikhith-2025
    role: pointOfContact

resources:
  cartodem:
    type: collection
    title: CartoDEM 30m (Cartosat-1)
    description: >-
      CartoDEM Version 4 digital elevation model (1 arc-second, about 30 m)
      generated by NRSC from Cartosat-1 PAN stereo imagery. Elevations in
      metres, WGS84. Source collection on Bhoonidhi:
      CartoSat-1_PAN_CartoDEM_30m.
    keywords:
      - CartoDEM
      - elevation
      - Cartosat-1
    links:
      - type: text/html
        rel: canonical
        title: Bhoonidhi
        href: https://bhoonidhi.nrsc.gov.in
        hreflang: en-US
    extents:
      spatial:
        bbox: [68, 6, 98, 38]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: coverage
        name: cartodem_service.provider.CartoDEMProvider
        data: data/cartodem.vrt
        options:
          compress: deflate
          predictor: 3
        format:
          name: GTiff
          mimetype: image/tiff
