# nginx in front of the coverage service replicas: load balancing with failover,
# response caching, a per-IP rate limit and gzip.

upstream coverage_service {
    # A replica that fails twice is skipped for 10 s; requests go to the other one
    server app1:5000 max_fails=2 fail_timeout=10s;
    server app2:5000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# Rate limit per client IP. Addresses in the allowlist (this machine and the
# Docker network, used for health checks and load tests) are not limited.
geo $rate_limited {
    default        1;
    127.0.0.1      0;
    172.16.0.0/12  0;
}
map $rate_limited $rate_limit_key {
    1 $binary_remote_addr;
    0 "";
}
limit_req_zone $rate_limit_key zone=per_ip:10m rate=20r/s;
limit_req_status 429;

# Access log with the replica that answered and the cache result
log_format upstream '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_addr cache=$upstream_cache_status';

# Coverage responses for a given URL never change once the tile is cached,
# so they can be kept for a long time
proxy_cache_path /var/cache/nginx/coverage levels=1:2 keys_zone=coverage:20m
                 max_size=2g inactive=24h use_temp_path=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    access_log /var/log/nginx/access.log upstream;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/prs.coverage+json application/schema+json
               application/geo+json application/ld+json application/vnd.oai.openapi+json
               text/css text/plain application/javascript;

    location / {
        limit_req zone=per_ip burst=40 nodelay;

        proxy_pass http://coverage_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connecting to a replica takes under a millisecond on the Docker network;
        # a dead replica must fail fast so the request moves to the other one
        proxy_connect_timeout 2s;
        # A first request for an uncached area waits for a Bhoonidhi download
        proxy_read_timeout 120s;
        # Retry on the other replica when this one can't be reached or times out.
        # A retried tile fetch is harmless: tile locks ensure one download.
        proxy_next_upstream error timeout;

        # Only successful responses are cached; 4xx/5xx (413, 503, ...) are not.
        # The Accept header is part of the key because it can select GeoTIFF.
        proxy_cache coverage;
        proxy_cache_key "$request_uri|$http_accept";
        proxy_cache_valid 200 24h;
        proxy_cache_lock on;
        proxy_cache_use_stale updating;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
