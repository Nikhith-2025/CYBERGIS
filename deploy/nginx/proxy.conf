# Request handling shared by the HTTP and HTTPS servers.

client_max_body_size 1m;
access_log /var/log/nginx/access.log upstream;

gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types application/json application/prs.coverage+json application/schema+json
           application/geo+json application/ld+json application/vnd.oai.openapi+json
           text/css text/plain application/javascript;

location / {
    limit_req zone=per_ip burst=40 nodelay;

    proxy_pass http://coverage_service;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Connecting to a replica takes under a millisecond on the Docker network;
    # a dead replica must fail fast so the request moves to the other one
    proxy_connect_timeout 2s;
    # A first request for an uncached area waits for a Bhoonidhi download
    proxy_read_timeout 120s;
    # Retry on the other replica when this one can't be reached or times out.
    # A retried tile fetch is harmless: tile locks ensure one download.
    proxy_next_upstream error timeout;

    # Only successful coverage responses are cached; 4xx/5xx (413, 503, ...) are not.
    # The Accept header is part of the key because it can select GeoTIFF.
    proxy_cache coverage;
    proxy_no_cache $skip_cache;
    proxy_cache_bypass $skip_cache;
    proxy_cache_key "$request_uri|$http_accept";
    proxy_cache_valid 200 24h;
    proxy_cache_lock on;
    proxy_cache_use_stale updating;
    add_header X-Cache-Status $upstream_cache_status always;
    # Here, not in the server block: an add_header in a location replaces inherited ones
    add_header Strict-Transport-Security $hsts_header always;
}
