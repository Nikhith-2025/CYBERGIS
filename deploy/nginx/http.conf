# Plain HTTP (default). Also answers Let's Encrypt's domain check, so the first
# certificate can be obtained before switching to https.conf.

include /etc/nginx/cybergis/common.conf;

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/cybergis/proxy.conf;
}
