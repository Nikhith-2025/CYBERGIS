# HTTPS (used with docker-compose.https.yml). HTTP only answers Let's Encrypt's
# renewal checks and redirects everything else to HTTPS.

include /etc/nginx/cybergis/common.conf;

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificate obtained with: certbot certonly --webroot --cert-name coverage ...
    ssl_certificate     /etc/letsencrypt/live/coverage/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coverage/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/cybergis/proxy.conf;
}
