# Settings shared by the HTTP and HTTPS configurations.

upstream coverage_service {
    # A replica that fails twice is skipped for 10 s; requests go to the other one
    server app1:5000 max_fails=2 fail_timeout=10s;
    server app2:5000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# Rate limit per client IP. Addresses in the allowlist (this machine and the
# Docker network, used for health checks and load tests) are not limited.
geo $rate_limited {
    default        1;
    127.0.0.1      0;
    172.16.0.0/12  0;
}
map $rate_limited $rate_limit_key {
    1 $binary_remote_addr;
    0 "";
}
limit_req_zone $rate_limit_key zone=per_ip:10m rate=20r/s;
limit_req_status 429;

# HSTS (tell browsers to always use HTTPS) only on HTTPS responses; an empty
# value means nginx doesn't send the header
map $scheme $hsts_header {
    https   "max-age=31536000";
    default "";
}

# Access log with the replica that answered and the cache result
log_format upstream '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_addr cache=$upstream_cache_status';

# Only coverage responses are cached: they are expensive and never change once
# the tile is cached. Pages and metadata are cheap and depend on the config
# (e.g. the public address in their links), so they always come fresh.
map $uri $skip_cache {
    ~/coverage$ 0;
    default     1;
}
proxy_cache_path /var/cache/nginx/coverage levels=1:2 keys_zone=coverage:20m
                 max_size=2g inactive=24h use_temp_path=off;
